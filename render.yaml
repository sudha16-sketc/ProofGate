# ProofGate — Render Blueprint for the lightweight analytics/relay API ONLY.
#
#   proofgate-api — analytics/API server (VITE_API_URL) AND the /check /prove
#                   relay to the LOCAL Midnight proof server via a secure tunnel
#
# The frontend is built and hosted separately (static Vite build of
# frontend/dist) and points at this service via frontend/.env.local.
#
# ZK proving NEVER runs on Render. The official `midnightntwrk/proof-server`
# runs on a developer machine (16 GB RAM), caches its ZK parameters there, and
# is reached by this service through an HTTPS tunnel URL set in PROOF_SERVER_URL.
# Render only streams proving payloads between the browser and that tunnel — it
# loads no SRS parameters and no proving keys, so the free plan (512 MB RAM /
# 0.1 CPU) is more than enough.
#
# Blueprint usage:
#   1. Create a new Blueprint on dashboard.render.com and paste this file's
#      contents (or push it and use "Blueprint" from the repo).
#   2. Fill the sync:false secrets (MONGODB_URI, ADMIN_API_TOKEN, CORS_ORIGIN,
#      PROOF_SERVER_URL, PROOF_SERVER_AUTH_TOKEN) in the dashboard.
#   3. Copy this service's *.onrender.com URL into frontend/.env.local as
#      VITE_API_URL and VITE_PROOF_SERVER_URL, then rebuild the frontend.
#      See docs/PROVING_ARCHITECTURE.md for the local proof server + tunnel setup.

services:
  # --- ProofGate analytics/API server + proof relay ------------------------
  - type: web
    name: proofgate-api
    runtime: docker
    plan: free
    dockerfilePath: server/Dockerfile
    healthCheckPath: /api/health
    envVars:
      - key: MONGODB_URI
        sync: false
      - key: ADMIN_API_TOKEN
        sync: false
      # Allowed browser origin for /api and the /check /prove relay. Use the
      # exact origin of the deployed frontend (e.g. https://proofgate.vercel.app).
      - key: CORS_ORIGIN
        sync: false
      # HTTPS URL of the secure tunnel to the LOCAL proof server
      # (e.g. https://<your-tunnel>.trycloudflare.com). The relay streams
      # /check and /prove here; proving runs on the developer machine, never
      # on Render.
      - key: PROOF_SERVER_URL
        sync: false
      # Shared secret the relay sends as `Authorization: Bearer <token>` so the
      # local tunnel proxy (proof-server/tunnel-proxy.mjs) accepts the request.
      # Must match the PROOF_SERVER_AUTH_TOKEN the tunnel proxy runs with.
      - key: PROOF_SERVER_AUTH_TOKEN
        sync: false
      # Hard cap (ms) for a relayed /prove round trip. Default 1200000 (20 min).
      # Keep well above 5 minutes: cold-started proof servers and heavy circuits
      # take minutes, and a premature abort surfaces as "Failed to fetch".
      - key: PROOF_SERVER_TIMEOUT_MS
        value: "1200000"
