# ProofGate — Render Blueprint for the two independently-deployed servers.
#
#   proofgate-proof-server — Midnight ZK proof server (VITE_PROOF_SERVER_URL)
#   proofgate-api          — analytics/API server (VITE_API_URL)
#
# The frontend is built and hosted separately (static Vite build of
# frontend/dist) and points at these two services via frontend/.env.local.
#
# Blueprint usage:
#   1. Create a new Blueprint on dashboard.render.com and paste this file's
#      contents (or push it and use "Blueprint" from the repo).
#   2. Fill the sync:false secrets (MONGODB_URI, ADMIN_API_TOKEN, CORS_ORIGIN,
#      PROOF_SERVER_URL) in the dashboard.
#   3. Copy each service's *.onrender.com URL into frontend/.env.local as
#      VITE_PROOF_SERVER_URL / VITE_API_URL, then rebuild the frontend.

services:
  # --- Midnight proof server (ZK proving backend) --------------------------
  #
  # Plan sizing: the official image holds the BLS12-381 public parameters and
  # multi-MB proving keys in memory while proving; the 512 MB `starter` plan
  # OOMs mid-proof ("Ran out of memory while running your code"), which kills
  # the connection and surfaces as "Failed to fetch". `standard` (2 GB / 1 CPU)
  # is the minimum that completes; bump to `pro` (4 GB / 2 CPU) to roughly
  # halve proof latency on CPU-bound circuits.
  - type: web
    name: proofgate-proof-server
    runtime: docker
    plan: standard
    dockerfilePath: proof-server/Dockerfile
    # GET / returns 200 on the official image.
    healthCheckPath: /
    # Persist the SRS params + proving keys the image downloads on first boot.
    # Without this, every restart (deploy, platform maintenance, OOM) re-fetches
    # them from srs.midnight.network, adding minutes to the first proof.
    disk:
      name: zk-params
      mountPath: /.cache/midnight/zk-params
      sizeGB: 5
    envVars:
      - key: RUST_LOG
        value: info

  # --- ProofGate analytics/API server -------------------------------------
  - type: web
    name: proofgate-api
    runtime: docker
    plan: starter
    dockerfilePath: server/Dockerfile
    healthCheckPath: /api/health
    envVars:
      - key: MONGODB_URI
        sync: false
      - key: ADMIN_API_TOKEN
        sync: false
      # Allowed browser origin for /api and the /check /prove relay. Use the
      # exact origin of the deployed frontend (e.g. https://proofgate.vercel.app).
      - key: CORS_ORIGIN
        sync: false
      # Public URL of proofgate-proof-server above, used by the /check /prove
      # relay when the browser is pointed at this service instead of the proof
      # server directly.
      - key: PROOF_SERVER_URL
        sync: false
